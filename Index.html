            if (!audioContext) {

            } else {

            }
        }

        function playCuteTune() {
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            let step = 0;

            if (melodyInterval) clearInterval(melodyInterval);

            melodyInterval = setInterval(() => {
                if (isMuted || !audioContext || audioContext.state !== 'running') return;

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = 'sine';
                const freq = notes[step % notes.length];
                osc.frequency.setValueAtTime(freq, audioContext.currentTime);

                gain.gain.setValueAtTime(0.008, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.04, audioContext.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1.1);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start();
                osc.stop(audioContext.currentTime + 1.1);

                step++;
            }, 750);
        }

                    speed: Math.random() * 0.02 + 0.005

            }
        }

        function renderStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

                starsCtx.save();
                starsCtx.globalAlpha = Math.abs(star.alpha);
                starsCtx.fillStyle = '#ffffff';
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                starsCtx.fill();
                starsCtx.restore();
            });
            requestAnimationFrame(renderStars);
        }

        window.addEventListener('resize', resizeStarsCanvas);
        resizeStarsCanvas();
        renderStars();

        function initFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartIcons = ['💖', '✨', '🌸', '⭐', '🎈', '💕'];
            
            for (let i = 0; i < 16; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 7}s`;
                heart.style.fontSize = `${Math.random() * 14 + 12}px`;
                container.appendChild(heart);
            }
        }

        // Fireworks Canvas Engine
        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const ctx = fireworksCanvas.getContext('2d');
        let particles = [];
        let floatingTexts = [];
        let fireworksAnimationId = null;

        function resizeFireworksCanvas() {
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeFireworksCanvas);
        resizeFireworksCanvas();

        class FloatingText {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1;
                this.velocity = -1.2;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = 'bold 20px "Fredoka", sans-serif';
                ctx.fillStyle = '#fef08a';
                ctx.shadowColor = '#f472b6';
                ctx.shadowBlur = 12;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }

            update() {
                this.y += this.velocity;
                this.alpha -= 0.012;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3.5 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 9,
                    y: (Math.random() - 0.5) * 9
                };
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.y += 0.05; // gravity
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        function createFireworksBurst(x, y) {
            const colors = ['#f472b6', '#fbbf24', '#c084fc', '#38bdf8', '#4ade80', '#f43f5e', '#a855f7'];
            const particleCount = 55;
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, chosenColor));
            }
        }

        function startFireworksLoop() {
            let autoLaunchTimer = 0;

            function animate() {
                ctx.fillStyle = 'rgba(9, 10, 15, 0.25)';
                ctx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

                autoLaunchTimer++;
                if (autoLaunchTimer % 30 === 0) {
                    const randomX = Math.random() * fireworksCanvas.width * 0.85 + fireworksCanvas.width * 0.075;
                    const randomY = Math.random() * fireworksCanvas.height * 0.5 + fireworksCanvas.height * 0.08;
                    createFireworksBurst(randomX, randomY);
                }

                particles.forEach((particle, index) => {
                    if (particle.alpha > 0) {
                        particle.update();
                        particle.draw();
                    } else {
                        particles.splice(index, 1);
                    }
                });

                floatingTexts.forEach((ft, index) => {
                    if (ft.alpha > 0) {
                        ft.update();
                        ft.draw();
                    } else {
                        floatingTexts.splice(index, 1);
                    }
                });

                fireworksAnimationId = requestAnimationFrame(animate);
            }

            if (!fireworksAnimationId) {
                animate();
            }
        }

        function stopFireworksLoop() {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
                ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
            }
        }

        function triggerFireworksInteraction(x, y) {
            playPopFX();
            createFireworksBurst(x, y);
            floatingTexts.push(new FloatingText(x, y, '✨ Selamat Ultah ke 25 Nimas Imo! ✨'));
        }

        fireworksCanvas.addEventListener('click', (e) => {
            triggerFireworksInteraction(e.clientX, e.clientY);
        });

        fireworksCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                triggerFireworksInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        window.onload = function() {
            initFloatingHearts();
            renderSlide();
        };
    </script>
</body>
</html>
